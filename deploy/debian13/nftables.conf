#!/usr/sbin/nft -f

flush ruleset

table inet filter {
    chain input {
        type filter hook input priority 0;
        policy drop;

        iifname "lo" accept
        ct state established,related accept
        ct state invalid drop

        # ICMP is useful for diagnostics and path MTU discovery.
        ip protocol icmp accept
        ip6 nexthdr ipv6-icmp accept

        # SSH administration.
        tcp dport 22 accept

        # Video Core UI and API.
        tcp dport 8090 accept
    }

    chain forward {
        type filter hook forward priority 0;
        policy drop;
    }

    chain output {
        type filter hook output priority 0;
        policy accept;
    }
}
