<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video Core</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
<style>
:root{color-scheme:dark;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;--bg:#050608;--line:#252a31;--text:#eef2f6;--muted:#87919d;--accent:#4b97d1;--good:#43d17d;--bad:#ff6575}
*{box-sizing:border-box}html,body,#app{margin:0;width:100%;height:100%;background:var(--bg);color:var(--text)}body{min-width:320px;overflow:hidden}button,input,select{font:inherit}button{touch-action:manipulation}
.top{height:46px;padding:0 10px;display:flex;align-items:center;gap:8px;background:#090b0e;border-bottom:1px solid #1c2026;z-index:30}.brand{font-size:12px;font-weight:800;letter-spacing:.12em;white-space:nowrap}.user-chip{color:var(--muted);font-size:11px;white-space:nowrap}.top-nav{display:flex;align-items:center;gap:2px;margin-left:10px}.top-spacer{flex:1}
.tab,.btn{min-height:30px;border:1px solid transparent;background:transparent;color:#bfc7d0;border-radius:5px;padding:5px 9px;cursor:pointer}.tab:hover,.btn:hover{background:#161a20;color:#fff}.tab.active,.btn.primary{background:#1a3245;border-color:#2c5874;color:#fff}.btn.danger{color:#ff9aa4}
.monitor-root{height:calc(100vh - 46px);display:flex;flex-direction:column;min-height:0}.monitor-stage{flex:1;min-height:0;position:relative;background:#000;overflow:hidden}
.camera-grid{width:100%;height:100%;display:grid;gap:2px;background:#000;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr))}
.camera-grid.grid-1{grid-template-columns:1fr;grid-template-rows:1fr}.camera-grid.grid-4{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr))}.camera-grid.grid-6{grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr))}.camera-grid.grid-9{grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr))}.camera-grid.grid-16{grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(4,minmax(0,1fr))}
.camera-tile{position:relative;min-width:0;min-height:0;background:#000;overflow:hidden;cursor:pointer;border:1px solid #171a1f}.camera-tile:hover{border-color:#30363f}.camera-tile video{position:absolute;inset:0;width:100%;height:100%;display:block;background:#000;object-fit:contain}
.tile-top,.tile-bottom{position:absolute;left:0;right:0;display:flex;align-items:center;gap:6px;padding:7px;pointer-events:none;transition:opacity .15s}.tile-top{top:0;background:linear-gradient(180deg,rgba(0,0,0,.82),rgba(0,0,0,0))}.tile-bottom{bottom:0;background:linear-gradient(0deg,rgba(0,0,0,.88),rgba(0,0,0,0))}.camera-tile:not(:hover) .tile-bottom{opacity:.3}
.tile-title{min-width:0;font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 3px #000}.tile-badge{display:inline-flex;align-items:center;gap:5px;padding:3px 6px;border-radius:4px;background:rgba(0,0,0,.55);font-size:9px;text-transform:uppercase;letter-spacing:.04em;border:1px solid rgba(255,255,255,.09);white-space:nowrap}.dot{width:6px;height:6px;border-radius:50%;background:var(--good);box-shadow:0 0 7px rgba(67,209,125,.6)}.dot.off{background:var(--bad);box-shadow:none}.tile-controls{margin-left:auto;display:flex;gap:3px;pointer-events:auto}
.stream-btn{min-width:36px;height:24px;padding:0 6px;border-radius:4px;border:1px solid rgba(255,255,255,.16);background:rgba(0,0,0,.65);color:#adb6c1;font-size:9px;font-weight:700;cursor:pointer}.stream-btn.active{background:#234d68;border-color:#4e84a7;color:#fff}.tile-error{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:18px;text-align:center;color:#89939f;font-size:12px;background:#050607}
.monitor-toolbar{height:44px;display:flex;align-items:center;gap:8px;padding:0 8px;background:#0b0d10;border-top:1px solid #1b1f24;z-index:20}.toolbar-group{display:flex;align-items:center;gap:3px}.toolbar-label{font-size:10px;color:#6f7883;margin:0 4px}.grid-button{min-width:31px;height:28px;min-height:28px;padding:0 7px;font-size:10px;border-radius:4px}.toolbar-spacer{flex:1}.status-line{font-size:10px;color:#707984;white-space:nowrap}.empty-monitor{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#64707d;font-size:13px}
.manage{height:calc(100vh - 46px);overflow:auto;padding:18px;max-width:1500px;margin:0 auto}.panel{background:#0d0f12;border:1px solid #1e2329;border-radius:8px;overflow:hidden}.panel-head,.head{min-height:48px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 14px;border-bottom:1px solid #20252b}.actions{display:flex;align-items:center;gap:5px;flex-wrap:wrap}.error{color:#ff929d;padding:10px 12px;font-size:12px}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.78);display:flex;align-items:center;justify-content:center;padding:14px;z-index:50}.modal{width:min(760px,100%);max-height:92vh;overflow:auto;background:#101317;border:1px solid #2b3138;border-radius:9px;box-shadow:0 24px 80px rgba(0,0,0,.65)}.modal-head{padding:13px 15px;border-bottom:1px solid #242930;display:flex;justify-content:space-between;align-items:center}.form{padding:16px;display:grid;grid-template-columns:1fr 1fr;gap:13px}.field{display:flex;flex-direction:column;gap:6px}.full{grid-column:1/-1}label{font-size:11px;color:#929dad}input,select{width:100%;background:#090b0e;border:1px solid #30363e;color:var(--text);border-radius:5px;padding:9px;min-height:38px}.checks{display:flex;gap:20px;flex-wrap:wrap}.checks label,.check-item{display:flex;gap:7px;align-items:center}.checks input,.check-item input{width:auto;min-height:0}.box-list{border:1px solid #30363e;border-radius:6px;padding:10px;max-height:190px;overflow:auto;display:grid;gap:8px}.modal-foot{padding:12px 15px;border-top:1px solid #242930;display:flex;justify-content:flex-end;gap:7px}
.auth{height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:#050608}.auth-card{width:min(420px,100%);background:#0d0f12;border:1px solid #242930;border-radius:9px;padding:24px}.auth-card h1{margin-top:0}.auth-card .field{margin-bottom:13px}.auth-card .btn{width:100%}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:11px 12px;border-bottom:1px solid #20252b;font-size:12px}th{color:#7f8994;font-weight:600}.row-actions{display:flex;gap:5px;justify-content:flex-end}
.scanner{padding:14px}.scanner-form{display:flex;gap:8px;align-items:end;flex-wrap:wrap}.scanner-form .field{min-width:230px}.scan-results{margin-top:12px;border:1px solid #242930;border-radius:7px;overflow:hidden}.scan-item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px;border-bottom:1px solid #20252b}.scan-item:last-child{border-bottom:0}.port-badges{display:flex;gap:6px;flex-wrap:wrap}.port-badge{padding:4px 7px;border-radius:5px;background:#17202a;color:#b8c5d3;font-size:10px}.stream-ok{color:var(--good)}.stream-error{color:var(--bad)}
@media(max-width:760px){body{overflow:auto}.top{height:auto;min-height:46px;flex-wrap:wrap;padding:6px 7px}.top-nav{order:3;width:100%;margin:0;overflow:auto}.top-nav .tab{flex:0 0 auto}.monitor-root{height:calc(100vh - 76px);min-height:520px}.camera-grid.grid-4,.camera-grid.grid-6,.camera-grid.grid-9,.camera-grid.grid-16{grid-template-columns:1fr;grid-template-rows:none;overflow:auto}.camera-tile{aspect-ratio:16/10}.monitor-toolbar{height:auto;min-height:44px;flex-wrap:wrap;padding:6px}.status-line{display:none}.manage{height:auto;min-height:calc(100vh - 76px);padding:10px}.form{grid-template-columns:1fr}.full{grid-column:auto}table{display:block;overflow-x:auto;white-space:nowrap}}
</style>
</head>
<body>
<div id="app">
  <div v-if="!ready" class="auth"><div class="auth-card"><strong>VIDEO CORE</strong><p class="muted">Проверка авторизации…</p></div></div>

  <div v-else-if="!authenticated" class="auth">
    <div class="auth-card">
      <h1>VIDEO CORE</h1>
      <div v-if="setupRequired">
        <p class="muted">Первый запуск. Создайте администратора.</p>
        <div class="field"><label>Логин</label><input v-model="login.username" autocomplete="username"></div>
        <div class="field"><label>Имя</label><input v-model="login.displayName"></div>
        <div class="field"><label>Пароль, минимум 8 символов</label><input v-model="login.password" type="password" autocomplete="new-password"></div>
        <button class="btn primary" @click="bootstrap">Создать администратора</button>
      </div>
      <div v-else>
        <div class="field"><label>Логин</label><input v-model="login.username" autocomplete="username" @keyup.enter="signin"></div>
        <div class="field"><label>Пароль</label><input v-model="login.password" type="password" autocomplete="current-password" @keyup.enter="signin"></div>
        <button class="btn primary" @click="signin">Войти</button>
      </div>
      <div v-if="error" class="error">{{error}}</div>
    </div>
  </div>

  <template v-else>
    <header class="top">
      <div class="brand">VIDEO CORE</div>
      <div class="top-nav">
        <button class="tab" :class="{active:tab==='live'}" @click="tab='live'">Монитор</button>
        <button v-if="currentUser.admin" class="tab" :class="{active:tab==='cameras'}" @click="tab='cameras'">Камеры</button>
        <button v-if="currentUser.admin" class="tab" :class="{active:tab==='sections'}" @click="tab='sections'">Разделы</button>
        <button v-if="currentUser.admin" class="tab" :class="{active:tab==='users'}" @click="tab='users'">Пользователи</button>
        <button v-if="currentUser.admin" class="tab" :class="{active:tab==='settings'}" @click="tab='settings'">Настройки</button>
      </div>
      <div class="top-spacer"></div>
      <span class="user-chip">{{currentUser.display_name}}</span>
      <button class="btn" @click="reload">↻</button>
      <button class="btn" @click="signout">Выйти</button>
    </header>
    <main v-if="tab==='live'" class="monitor-root">
      <section class="monitor-stage" @dblclick.self="clearFocus">
        <div class="camera-grid" :class="'grid-'+gridSize" v-if="cameras.length">
          <section v-for="camera in visibleCameras" :key="camera.id" class="camera-tile" @dblclick.stop="focusCamera(camera)">
            <video :ref="el => setVideoRef(camera.id,el)" autoplay playsinline muted></video>
            <div v-if="liveErrors[camera.id]" class="tile-error">{{liveErrors[camera.id]}}</div>
            <div class="tile-top">
              <div class="tile-badge"><span class="dot" :class="{off:!camera.running || !camera.stream_ok}"></span><span class="tile-title">{{camera.name}}</span></div>
              <span v-if="camera.recording" class="tile-badge">● REC</span>
            </div>
            <div class="tile-bottom">
              <span class="tile-badge">{{streamFor(camera)==='main'?'MAIN':'SUB'}}</span>
              <div class="tile-controls">
                <button class="stream-btn" :class="{active:streamFor(camera)==='sub'}" @click.stop="setCameraStream(camera,'sub')">SUB</button>
                <button class="stream-btn" :class="{active:streamFor(camera)==='main'}" @click.stop="setCameraStream(camera,'main')">MAIN</button>
              </div>
            </div>
          </section>
        </div>
        <div v-else class="empty-monitor">Нет доступных камер.</div>
      </section>
      <footer class="monitor-toolbar">
        <div class="toolbar-group"><span class="toolbar-label">СЕТКА</span><button v-for="n in [1,4,6,9,16]" :key="n" class="btn grid-button" :class="{primary:gridSize===n}" @click="setGridSize(n)">{{n}}</button></div>
        <div class="toolbar-group"><span class="toolbar-label">ВСЕ</span><button class="btn grid-button" :class="{primary:defaultStream==='sub'}" @click="setDefaultStream('sub')">SUB</button><button class="btn grid-button" :class="{primary:defaultStream==='main'}" @click="setDefaultStream('main')">MAIN</button></div>
        <div class="toolbar-spacer"></div>
        <div class="status-line">{{visibleCameras.length}} / {{cameras.length}} камер · двойной клик — развернуть · Esc — вернуть сетку</div>
      </footer>
    </main>

    <main v-if="tab==='cameras' && currentUser.admin" class="manage">
      <section class="panel">
        <div class="panel-head"><div><strong>Камеры</strong><div class="muted">101 — запись, 102 — просмотр</div></div><div class="actions"><button class="btn" @click="scanOpen=true">Сканировать сеть</button><button class="btn primary" @click="openNew">+ Добавить камеру</button></div></div>
        <table v-if="cameras.length"><thead><tr><th>Камера</th><th>Раздел</th><th>Статус</th><th>Автозапуск</th><th></th></tr></thead><tbody>
          <tr v-for="camera in cameras" :key="camera.id"><td><strong>{{camera.name}}</strong><div class="muted">{{camera.id}}</div></td><td>{{camera.section_name||'—'}}</td><td><span :class="camera.stream_ok?'stream-ok':'stream-error'">{{camera.stream_ok?'Поток работает':(camera.running?'Нет изображения':'Остановлена')}}</span><div v-if="camera.stream_error" class="muted">{{camera.stream_error}}</div></td><td>{{camera.autostart?'Да':'Нет'}}</td><td class="row-actions"><button class="btn" @click="toggle(camera)">{{camera.running?'Стоп':'Старт'}}</button><button class="btn" @click="openEdit(camera)">Изменить</button><button class="btn danger" @click="remove(camera)">Удалить</button></td></tr>
        </tbody></table><div v-else class="empty-list">Камеры ещё не добавлены.</div>
      </section>
    </main>

    <main v-if="tab==='sections' && currentUser.admin" class="manage"><section class="panel">
      <div class="panel-head"><div><strong>Разделы</strong><div class="muted">Группировка камер для прав доступа</div></div><button class="btn primary" @click="openSectionNew">+ Добавить раздел</button></div>
      <table v-if="sections.length"><thead><tr><th>Раздел</th><th>Порядок</th><th></th></tr></thead><tbody><tr v-for="section in sections" :key="section.id"><td><strong>{{section.name}}</strong></td><td>{{section.sort_order}}</td><td class="row-actions"><button class="btn" @click="openSectionEdit(section)">Изменить</button><button class="btn danger" @click="removeSection(section)">Удалить</button></td></tr></tbody></table><div v-else class="empty-list">Разделы ещё не созданы.</div>
    </section></main>

    <main v-if="tab==='users' && currentUser.admin" class="manage"><section class="panel">
      <div class="panel-head"><div><strong>Пользователи</strong><div class="muted">Доступ: все камеры, разделы или отдельные камеры</div></div><button class="btn primary" @click="openUserNew">+ Добавить пользователя</button></div>
      <table v-if="users.length"><thead><tr><th>Пользователь</th><th>Роль</th><th>Доступ к камерам</th><th>Статус</th><th></th></tr></thead><tbody><tr v-for="u in users" :key="u.id"><td><strong>{{u.display_name}}</strong><div class="muted">{{u.username}}</div></td><td>{{roleName(u.role)}}</td><td>{{scopeName(u.scope)}}</td><td>{{u.active?'Активен':'Отключён'}}</td><td class="row-actions"><button class="btn" @click="openUserEdit(u)">Изменить</button><button class="btn danger" @click="removeUser(u)">Удалить</button></td></tr></tbody></table><div v-else class="empty-list">Пользователей нет.</div>
    </section></main>

    <main v-if="tab==='settings' && currentUser.admin" class="manage"><section class="panel">
      <div class="panel-head"><div><strong>Настройки записи</strong><div class="muted">Основной поток камеры 101 сохраняется напрямую без перекодирования</div></div></div>
      <div class="form"><div class="field full"><label>Каталог архива</label><input v-model.trim="config.recording_dir" placeholder="/mnt/truenas/video"></div><div class="field"><label>Запись после окончания движения, секунд</label><input v-model.number="config.motion_post_seconds" type="number" min="0"></div></div>
      <div class="modal-foot"><button class="btn primary" @click="saveConfig">Сохранить настройки</button></div>
    </section></main>

    <div v-if="scanOpen" class="modal-backdrop" @click.self="scanOpen=false"><div class="modal"><div class="modal-head"><div><strong>Сканирование сети</strong><div class="muted">Проверяем TCP 554, 80 и 443. Только приватные IPv4 /24.</div></div><button class="btn" @click="scanOpen=false">Закрыть</button></div><div class="scanner"><div class="scanner-form"><div class="field"><label>Сеть</label><input v-model.trim="scanCIDR" placeholder="10.120.10.0/24"></div><button class="btn primary" :disabled="scanBusy" @click="scanNetwork">{{scanBusy?'Сканирование…':'Начать сканирование'}}</button></div><div v-if="scanResults.length" class="scan-results"><div v-for="r in scanResults" :key="r.ip" class="scan-item"><div><strong>{{r.ip}}</strong><div class="muted">{{r.server||'Устройство отвечает по сети'}}</div></div><div class="port-badges"><span v-if="r.rtsp" class="port-badge">RTSP 554</span><span v-if="r.http" class="port-badge">HTTP 80</span><span v-if="r.https" class="port-badge">HTTPS 443</span><button class="btn" @click="form.ip=r.ip;form.username='admin';form.password='';form.enabled=true;form.autostart=true;form.section_id='';form.sort_order=0;editing=false;editingId='';scanOpen=false;modal=true">Добавить</button></div></div></div><div v-else-if="!scanBusy" class="empty-list">Ничего не найдено.</div></div></div></div>
    <div v-if="modal" class="modal-backdrop" @click.self="modal=false"><div class="modal"><div class="modal-head"><strong>{{editing?'Редактирование камеры':'Новая камера'}}</strong><button class="btn" @click="modal=false">Закрыть</button></div><form @submit.prevent="saveCamera"><div class="form"><div class="field full"><label>IP-адрес</label><input v-model.trim="form.ip" required></div><div class="field"><label>Логин</label><input v-model.trim="form.username" required></div><div class="field"><label>Пароль</label><input v-model="form.password" type="password" :required="!editing"></div><div class="field"><label>Раздел</label><select v-model="form.section_id"><option value="">Без раздела</option><option v-for="s in sections" :value="String(s.id)">{{s.name}}</option></select></div><div class="field"><label>Порядок</label><input v-model.number="form.sort_order" type="number" min="0"></div><div class="checks"><label><input v-model="form.enabled" type="checkbox"> Камера включена</label><label><input v-model="form.autostart" type="checkbox"> Автозапуск</label></div></div><div class="modal-foot"><button type="button" class="btn" @click="modal=false">Отмена</button><button class="btn primary" type="submit">{{editing?'Сохранить':'Добавить'}}</button></div><div v-if="error" class="error" style="padding:0 16px 12px">{{error}}</div></form></div></div>

    <div v-if="sectionModal" class="modal-backdrop" @click.self="sectionModal=false"><div class="modal"><div class="modal-head"><strong>{{sectionEditing?'Редактирование раздела':'Новый раздел'}}</strong><button class="btn" @click="sectionModal=false">Закрыть</button></div><form @submit.prevent="saveSection"><div class="form"><div class="field full"><label>Название</label><input v-model.trim="sectionForm.name" required></div><div class="field"><label>Порядок</label><input v-model.number="sectionForm.sort_order" type="number" min="0"></div></div><div class="modal-foot"><button type="button" class="btn" @click="sectionModal=false">Отмена</button><button class="btn primary" type="submit">Сохранить</button></div></form></div></div>

    <div v-if="userModal" class="modal-backdrop" @click.self="userModal=false"><div class="modal"><div class="modal-head"><strong>{{userEditing?'Редактирование пользователя':'Новый пользователь'}}</strong><button class="btn" @click="userModal=false">Закрыть</button></div><form @submit.prevent="saveUser"><div class="form"><div class="field"><label>Логин</label><input v-model.trim="userForm.username" required></div><div class="field"><label>Имя</label><input v-model.trim="userForm.displayName" required></div><div class="field"><label>Пароль {{userEditing?'(оставьте пустым, чтобы не менять)':''}}</label><input v-model="userForm.password" type="password" :required="!userEditing"></div><div class="field"><label>Роль</label><select v-model="userForm.role"><option value="viewer">Наблюдатель</option><option value="operator">Оператор</option><option value="admin">Администратор</option></select></div><div class="field full"><label>Доступ к камерам</label><select v-model="userForm.scope"><option value="all_cameras">Все камеры</option><option value="section">Целый раздел</option><option value="selected">Отдельные камеры</option><option value="none">Нет доступа</option></select></div><div v-if="userForm.scope==='section'" class="field full"><label>Разделы</label><div class="box-list"><label v-for="s in sections" :key="s.id" class="check-item"><input type="checkbox" :value="Number(s.id)" v-model="userForm.sectionIDs"> {{s.name}}</label></div></div><div v-if="userForm.scope==='selected'" class="field full"><label>Камеры</label><div class="box-list"><label v-for="c in allCameras" :key="c.id" class="check-item"><input type="checkbox" :value="Number(c.db_id)" v-model="userForm.cameraIDs"> {{c.name}} <span class="muted">{{c.section_name||'без раздела'}}</span></label></div></div><div class="field full"><label class="check-item"><input type="checkbox" v-model="userForm.active"> Пользователь активен</label></div></div><div class="modal-foot"><button type="button" class="btn" @click="userModal=false">Отмена</button><button class="btn primary" type="submit">Сохранить</button></div></form></div></div>

    <div v-if="error" class="error">{{error}}</div>
  </template>
</div>

<script>
const {createApp}=Vue;
createApp({
data(){return{ready:false,authenticated:false,setupRequired:false,currentUser:null,login:{username:'',password:'',displayName:''},error:'',tab:'live',cameras:[],allCameras:[],sections:[],users:[],gridSize:4,defaultStream:'sub',cameraStreams:{},videoRefs:{},streamPCs:{},liveErrors:{},focusedCameraId:'',scanOpen:false,scanCIDR:'10.120.10.0/24',scanBusy:false,scanResults:[],modal:false,editing:false,editingId:'',form:{ip:'',username:'',password:'',enabled:true,autostart:true,section_id:'',sort_order:0},sectionModal:false,sectionEditing:false,sectionForm:{id:null,name:'',sort_order:0},userModal:false,userEditing:false,userEditingId:0,userForm:{username:'',displayName:'',password:'',role:'viewer',scope:'selected',sectionIDs:[],cameraIDs:[],active:true},config:{recording_dir:'',motion_post_seconds:10}}},
methods:{
async api(url,opt){const r=await fetch(url,opt||{});if(!r.ok){let t=await r.text();throw new Error(t||('HTTP '+r.status));}return r.json()},
async checkAuth(){try{const d=await this.api('/api/auth/status');this.setupRequired=!!d.setup_required;this.authenticated=!!d.authenticated;this.currentUser=d.user;if(this.authenticated)await this.reload();}catch(e){this.error=e.message}finally{this.ready=true}},
async signin(){try{this.error='';await this.api('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:this.login.username,password:this.login.password})});this.login.password='';await this.checkAuth()}catch(e){this.error=e.message}},
async bootstrap(){try{this.error='';await this.api('/api/auth/bootstrap',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:this.login.username,password:this.login.password,displayName:this.login.displayName})});this.login.password='';await this.checkAuth()}catch(e){this.error=e.message}},
async signout(){await fetch('/api/auth/logout',{method:'POST'});location.reload()},
async reload(){this.error='';try{this.cameras=await this.api('/api/cameras');this.sections=await this.api('/api/sections');if(this.currentUser&&this.currentUser.admin){this.allCameras=await this.api('/api/cameras?all=1');await this.loadUsers();const d=await this.api('/api/config');this.config=d}}catch(e){if(String(e.message).includes('unauthorized')){location.reload()}else{this.error=e.message}}},
async loadUsers(){this.users=await this.api('/api/users')},
roleName(r){return r==='admin'?'Администратор':r==='operator'?'Оператор':'Наблюдатель'},
streamFor(camera){return this.cameraStreams[camera.id]||this.defaultStream},
setVideoRef(id,el){if(el)this.videoRefs[id]=el;else delete this.videoRefs[id]},
focusCamera(camera){this.focusedCameraId=camera.id;this.gridSize=1;this.syncGridStreams()},
clearFocus(){if(this.focusedCameraId){this.focusedCameraId='';this.gridSize=4;this.syncGridStreams()}},
async connectStream(camera,stream){
  this.closeStream(camera.id);
  if(!camera.running){this.liveErrors[camera.id]='Камера остановлена';return}
  const video=this.videoRefs[camera.id];
  if(!video)return;
  try{
    const pc=new RTCPeerConnection();
    this.streamPCs[camera.id]=pc;
    pc.ontrack=e=>{if(this.videoRefs[camera.id])this.videoRefs[camera.id].srcObject=e.streams[0]};
    pc.onconnectionstatechange=()=>{
      if(['failed','disconnected'].includes(pc.connectionState)&&this.streamPCs[camera.id]===pc){
        this.liveErrors[camera.id]='Поток недоступен';
      }else if(pc.connectionState==='connected'&&this.streamPCs[camera.id]===pc){
        delete this.liveErrors[camera.id];
      }
    };
    pc.addTransceiver('video',{direction:'recvonly'});
    const offer=await pc.createOffer();
    await pc.setLocalDescription(offer);
    if(pc.iceGatheringState!=='complete'){
      await new Promise(resolve=>{
        const timer=setTimeout(resolve,3000);
        pc.onicegatheringstatechange=()=>{if(pc.iceGatheringState==='complete'){clearTimeout(timer);resolve()}};
      });
    }
    const answer=await fetch('/api/cameras/'+encodeURIComponent(camera.id)+'/webrtc?stream='+encodeURIComponent(stream),{
      method:'POST',headers:{'Content-Type':'application/sdp'},body:pc.localDescription.sdp
    });
    if(!answer.ok)throw new Error((await answer.text())||('HTTP '+answer.status));
    await pc.setRemoteDescription({type:'answer',sdp:await answer.text()});
    if(this.streamPCs[camera.id]!==pc)pc.close();
  }catch(e){
    if(this.streamPCs[camera.id])delete this.streamPCs[camera.id];
    this.liveErrors[camera.id]='Ошибка '+e.message;
  }
},
closeStream(id){
  const pc=this.streamPCs[id];
  if(pc){pc.ontrack=null;pc.close();delete this.streamPCs[id]}
  const video=this.videoRefs[id];
  if(video)video.srcObject=null;
},
async syncGridStreams(){
  if(this.tab!=='live'){this.closeAllStreams();return}
  const visible=new Set(this.visibleCameras.map(c=>c.id));
  for(const id of Object.keys(this.streamPCs))if(!visible.has(id))this.closeStream(id);
  await this.$nextTick();
  for(const camera of this.visibleCameras){
    const stream=this.streamFor(camera);
    const pc=this.streamPCs[camera.id];
    if(!pc||pc.connectionState==='failed'||pc.connectionState==='closed')await this.connectStream(camera,stream);
  }
},
closeAllStreams(){for(const id of Object.keys(this.streamPCs))this.closeStream(id)},
setGridSize(n){this.focusedCameraId='';this.gridSize=n;this.syncGridStreams()},
setDefaultStream(stream){this.defaultStream=stream;for(const camera of this.visibleCameras)this.cameraStreams[camera.id]=stream;this.syncGridStreams()},
setCameraStream(camera,stream){this.cameraStreams[camera.id]=stream;this.connectStream(camera,stream)},
scopeName(s){return s==='all_cameras'?'Все камеры':s==='section'?'Раздел':s==='none'?'Нет доступа':'Отдельные камеры'},
emptyCamera(){return{ip:'',username:'',password:'',enabled:true,autostart:true,section_id:'',sort_order:0}},
openNew(){this.error='';this.editing=false;this.form=this.emptyCamera();this.modal=true},
async openEdit(c){this.error='';const d=await this.api('/api/cameras/'+encodeURIComponent(c.id)+'/details');this.editing=true;this.editingId=c.id;this.form={ip:d.ip||'',username:d.username||'',password:'',enabled:c.enabled,autostart:c.autostart,section_id:c.section_id?String(c.section_id):'',sort_order:c.sort_order||0};this.modal=true},
async saveCamera(){
  try{
    this.error='';
    const body={
      ip:this.form.ip,
      username:this.form.username,
      password:this.form.password,
      enabled:!!this.form.enabled,
      autostart:!!this.form.autostart,
      section_id:this.form.section_id?Number(this.form.section_id):null,
      sort_order:Number(this.form.sort_order)||0
    };
    const result=await this.api(this.editing?'/api/cameras/'+encodeURIComponent(this.editingId)+'/update':'/api/cameras',{
      method:this.editing?'PUT':'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(body)
    });
    this.modal=false;
    await this.reload();
    this.tab='cameras';
    if(result&&result.start_error)this.error='Камера добавлена, но не запустилась: '+result.start_error;
  }catch(e){
    this.error='Не удалось сохранить камеру: '+e.message;
  }
},
async remove(c){if(!confirm('Удалить камеру «'+c.name+'»?'))return;try{await this.api('/api/cameras/'+encodeURIComponent(c.id)+'/delete',{method:'DELETE'});await this.reload()}catch(e){this.error=e.message}},
async toggle(c){try{await this.api('/api/cameras/'+encodeURIComponent(c.id)+'/'+(c.running?'stop':'start'),{method:'POST'});await new Promise(r=>setTimeout(r,350));await this.reload()}catch(e){this.error=e.message}},
scanOpenNetwork(){this.scanResults=[];this.scanOpen=true},
async scanNetwork(){try{this.scanBusy=true;this.error='';this.scanResults=await this.api('/api/scan?cidr='+encodeURIComponent(this.scanCIDR));}catch(e){this.error=e.message}finally{this.scanBusy=false}},
openSectionNew(){this.sectionEditing=false;this.sectionForm={id:null,name:'',sort_order:0};this.sectionModal=true},
openSectionEdit(s){this.sectionEditing=true;this.sectionForm={id:s.id,name:s.name,sort_order:s.sort_order||0};this.sectionModal=true},
async saveSection(){try{const body={name:this.sectionForm.name,sort_order:Number(this.sectionForm.sort_order)||0};await this.api(this.sectionEditing?'/api/sections/'+this.sectionForm.id:'/api/sections',{method:this.sectionEditing?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});this.sectionModal=false;await this.reload();this.tab='sections'}catch(e){this.error=e.message}},
async removeSection(s){if(!confirm('Удалить раздел «'+s.name+'»?'))return;try{await this.api('/api/sections/'+s.id,{method:'DELETE'});await this.reload()}catch(e){this.error=e.message}},
openUserNew(){this.userEditing=false;this.userForm={username:'',displayName:'',password:'',role:'viewer',scope:'selected',sectionIDs:[],cameraIDs:[],active:true};this.userModal=true},
async openUserEdit(u){const d=await this.api('/api/users/'+u.id);this.userEditing=true;this.userEditingId=u.id;this.userForm={username:d.username,displayName:d.display_name,password:'',role:d.role,scope:d.scope,sectionIDs:d.section_ids||[],cameraIDs:d.camera_ids||[],active:d.active};this.userModal=true},
async saveUser(){try{const body={username:this.userForm.username,displayName:this.userForm.displayName,password:this.userForm.password,role:this.userForm.role,scope:this.userForm.scope,sectionIDs:this.userForm.sectionIDs,cameraIDs:this.userForm.cameraIDs,active:this.userForm.active};await this.api(this.userEditing?'/api/users/'+this.userEditingId:'/api/users',{method:this.userEditing?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});this.userModal=false;await this.loadUsers();await this.reload()}catch(e){this.error=e.message}},
async removeUser(u){if(!confirm('Удалить пользователя «'+u.display_name+'»?'))return;try{await this.api('/api/users/'+u.id,{method:'DELETE'});await this.loadUsers()}catch(e){this.error=e.message}},
async saveConfig(){try{this.config.motion_post_seconds=Number(this.config.motion_post_seconds)||0;await this.api('/api/config',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({RecordingDir:this.config.recording_dir,MotionPostSeconds:this.config.motion_post_seconds})});alert('Настройки сохранены')}catch(e){this.error=e.message}}
},
computed:{visibleCameras(){
  if(this.focusedCameraId){
    const focused=this.cameras.find(c=>c.id===this.focusedCameraId);
    return focused?[focused]:this.cameras.slice(0,1);
  }
  return this.cameras.slice(0,this.gridSize);
}},
mounted(){
  window.addEventListener('keydown',e=>{if(e.key==='Escape'&&this.focusedCameraId)this.clearFocus()});
  this.checkAuth().then(()=>this.$nextTick(()=>this.syncGridStreams()));
  setInterval(()=>{if(this.authenticated)this.reload()},15000);
  setInterval(()=>{if(this.authenticated&&this.tab==='live')this.syncGridStreams()},15000);
},
watch:{
  tab(){this.$nextTick(()=>this.syncGridStreams())},
  cameras(){if(this.tab==='live')this.$nextTick(()=>this.syncGridStreams())}
}
}).mount('#app');
</script>
</body>
</html>
