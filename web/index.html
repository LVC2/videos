<style>

.auth{height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(circle at 50% 0,#102033 0,#071019 45%,#05090e 100%)}.auth-card{width:min(420px,100%);background:rgba(13,22,32,.94);border:1px solid rgba(130,155,180,.18);border-radius:12px;padding:25px;box-shadow:0 25px 70px rgba(0,0,0,.42)}.auth-card h1{margin-top:0}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:11px 12px;border-bottom:1px solid rgba(130,155,180,.1);font-size:12px}th{color:#7f90a0;font-weight:650}.row-actions{display:flex;gap:5px;justify-content:flex-end}
.scanner{padding:14px}.scanner-form{display:flex;gap:8px;align-items:end;flex-wrap:wrap}.scanner-form .field{min-width:230px}.scan-results{margin-top:12px;border:1px solid rgba(130,155,180,.14);border-radius:8px;overflow:hidden}.scan-item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px;border-bottom:1px solid rgba(130,155,180,.1)}.scan-item:last-child{border-bottom:0}.port-badges{display:flex;gap:6px;flex-wrap:wrap}.port-badge{padding:4px 7px;border-radius:6px;background:#142231;color:#b8c5d3;font-size:10px}.stream-ok{color:var(--good)}.stream-error{color:var(--bad)}

<body>
<div id="app">
  <div v-if="!ready" class="auth"><div class="auth-card"><strong>VIDEO CORE</strong><p class="muted">Проверка авторизации…</p></div></div>

  <div v-else-if="!authenticated" class="auth">
    <div class="auth-card">
      <h1>VIDEO CORE</h1>
      <div v-if="setupRequired">
        <p class="muted">Первый запуск. Создайте администратора.</p>
        <div class="field"><label>Логин</label><input v-model="login.username" autocomplete="username"></div>
        <div class="field"><label>Имя</label><input v-model="login.displayName"></div>
        <div class="field"><label>Пароль, минимум 8 символов</label><input v-model="login.password" type="password" autocomplete="new-password"></div>
        <button class="btn primary" @click="bootstrap">Создать администратора</button>
      </div>
      <div v-else>
        <div class="field"><label>Логин</label><input v-model="login.username" autocomplete="username" @keyup.enter="signin"></div>
        <div class="field"><label>Пароль</label><input v-model="login.password" type="password" autocomplete="current-password" @keyup.enter="signin"></div>
        <button class="btn primary" @click="signin">Войти</button>
      </div>
      <div v-if="error" class="error">{{error}}</div>
    </div>
  </div>

  <template v-else>
    <header class="top">
      <div class="brand">VIDEO CORE</div>
      <div class="top-nav">
        <button class="tab" :class="{active:tab==='live'}" @click="tab='live'">Монитор</button>
        <button class="tab" :class="{active:tab==='dvr'}" @click="tab='dvr'">DVR</button>
        <button v-if="currentUser.admin" class="tab" :class="{active:tab==='cameras'}" @click="tab='cameras'">Камеры</button>
        <button v-if="currentUser.admin" class="tab" :class="{active:tab==='sections'}" @click="tab='sections'">Разделы</button>
        <button v-if="currentUser.admin" class="tab" :class="{active:tab==='users'}" @click="tab='users'">Пользователи</button>
        <button v-if="currentUser.admin" class="tab" :class="{active:tab==='settings'}" @click="tab='settings'">Настройки</button>
      </div>
      <div class="top-spacer"></div>
      <div v-if="tab==='live'" class="live-summary">
        <span class="summary-item"><i class="summary-dot online"></i>{{onlineCount}}</span>
        <span class="summary-item"><i class="summary-dot recording"></i>{{recordingCount}}</span>
      </div>
      <button v-if="tab==='live'" class="icon-btn alerts-btn" :class="{alerting:alerts.length}" title="Состояние камер" @click="alertsOpen=!alertsOpen">🔔<span v-if="alerts.length" class="alert-count">{{alerts.length}}</span></button>
      <span class="user-chip">{{currentUser.display_name}}</span>
      <button class="btn" @click="reload">↻</button>
      <button class="btn" @click="signout">Выйти</button>
    </header>

      <div class="form"><div class="field full"><label>Каталог архива</label><input v-model.trim="config.recording_dir" placeholder="/mnt/truenas/video"></div><div class="field"><label>Запись после окончания движения, секунд</label><input v-model.number="config.motion_post_seconds" type="number" min="0"></div></div>

    <div v-if="scanOpen" class="modal-backdrop" @click.self="scanOpen=false"><div class="modal"><div class="modal-head"><div><strong>Сканирование сети</strong><div class="muted">Проверяем TCP 554, 80 и 443. Только приватные IPv4 /24.</div></div><button class="btn" @click="scanOpen=false">Закрыть</button></div><div class="scanner"><div class="scanner-form"><div class="field"><label>Сеть</label><input v-model.trim="scanCIDR" placeholder="10.120.10.0/24"></div><button class="btn primary" :disabled="scanBusy" @click="scanNetwork">{{scanBusy?'Сканирование…':'Начать сканирование'}}</button></div><div v-if="scanResults.length" class="scan-results"><div v-for="r in scanResults" :key="r.ip" class="scan-item"><div><strong>{{r.ip}}</strong><div class="muted">{{r.server||'Устройство отвечает по сети'}}</div></div><div class="port-badges"><span v-if="r.rtsp" class="port-badge">RTSP 554</span><span v-if="r.http" class="port-badge">HTTP 80</span><span v-if="r.https" class="port-badge">HTTPS 443</span><button class="btn" @click="form.ip=r.ip;form.username='admin';form.password='';form.enabled=true;form.autostart=true;form.section_id='';form.sort_order=0;editing=false;editingId='';scanOpen=false;modal=true">Добавить</button></div></div></div><div v-else-if="!scanBusy" class="empty-list">Ничего не найдено.</div></div></div></div>
    <div v-if="dvrChannelsId" class="modal-backdrop" @click.self="dvrChannelsId=0"><div class="modal"><div class="modal-head"><strong>Каналы — {{dvrChannelsName}}</strong><button class="btn" @click="dvrChannelsId=0">Закрыть</button></div><div style="padding:14px"><div v-if="dvrChannelsBusy" class="empty-list">Загрузка каналов…</div><div v-else class="box-list" style="max-height:60vh"><label v-for="channel in dvrChannels" :key="channel.id" class="check-item" style="justify-content:space-between"><span><strong>CH{{String(channel.channel).padStart(2,'0')}}</strong> <span class="muted">{{channel.name}}</span></span><span><input type="checkbox" :checked="channel.enabled" @change="toggleDvrChannel(channel)"> <span :class="channel.enabled?'stream-ok':'stream-error'">{{channel.enabled?'Включён':'Отключён'}}</span></span></label></div></div><div class="modal-foot"><span class="muted">Отключённые каналы не запускаются и не показываются в мониторе.</span><button class="btn" @click="dvrChannelsId=0">Готово</button></div></div></div>
    <div v-if="dvrModal" class="modal-backdrop" @click.self="dvrModal=false"><div class="modal"><div class="modal-head"><strong>{{dvrEditing?'Редактирование DVR':'Новый DVR'}}</strong><button class="btn" @click="dvrModal=false">Закрыть</button></div><form @submit.prevent="saveDvr"><div class="form"><div class="field full"><label>Название</label><input v-model.trim="dvrForm.name" required placeholder="DVR Периметр №1"></div><div class="field"><label>IP-адрес</label><input v-model.trim="dvrForm.ip" required placeholder="10.120.10.60"></div><div class="field"><label>Логин</label><input v-model.trim="dvrForm.username" required></div><div class="field"><label>Пароль {{dvrEditing?'(оставьте пустым, чтобы не менять)':''}}</label><input v-model="dvrForm.password" type="password" :required="!dvrEditing"></div><div class="field"><label>Группа</label><select v-model="dvrForm.section_id"><option value="">Без группы</option><option v-for="s in sections" :value="String(s.id)">{{s.name}}</option></select></div><div class="field"><label>Количество каналов</label><select v-model.number="dvrForm.channels"><option :value="4">4</option><option :value="8">8</option><option :value="16">16</option><option :value="32">32</option></select><div class="muted">При изменении DVR новые каналы будут добавлены автоматически, а каналы выше выбранного количества отключены.</div></div><div class="checks"><label><input v-model="dvrForm.enabled" type="checkbox"> DVR включён</label><label><input v-model="dvrForm.autostart" type="checkbox"> Автозапуск каналов</label></div></div><div class="modal-foot"><button type="button" class="btn" @click="dvrModal=false">Отмена</button><button class="btn primary" type="submit">Сохранить</button></div><div v-if="error" class="error" style="padding:0 16px 12px">{{error}}</div></form></div></div>
    <div v-if="modal" class="modal-backdrop" @click.self="modal=false"><div class="modal"><div class="modal-head"><strong>{{editing?'Редактирование камеры':'Новая камера'}}</strong><button class="btn" @click="modal=false">Закрыть</button></div><form @submit.prevent="saveCamera"><div class="form"><div class="field full"><label>IP-адрес</label><input v-model.trim="form.ip" required></div><div class="field"><label>Логин</label><input v-model.trim="form.username" required></div><div class="field"><label>Пароль</label><input v-model="form.password" type="password" :required="!editing"></div><div class="field"><label>Раздел</label><select v-model="form.section_id"><option value="">Без раздела</option><option v-for="s in sections" :value="String(s.id)">{{s.name}}</option></select></div><div class="field"><label>Порядок</label><input v-model.number="form.sort_order" type="number" min="0"></div><div class="checks"><label><input v-model="form.enabled" type="checkbox"> Камера включена</label><label><input v-model="form.autostart" type="checkbox"> Автозапуск</label></div></div><div class="modal-foot"><button type="button" class="btn" @click="modal=false">Отмена</button><button class="btn primary" type="submit">{{editing?'Сохранить':'Добавить'}}</button></div><div v-if="error" class="error" style="padding:0 16px 12px">{{error}}</div></form></div></div>

    <div v-if="sectionModal" class="modal-backdrop" @click.self="sectionModal=false"><div class="modal"><div class="modal-head"><strong>{{sectionEditing?'Редактирование раздела':'Новый раздел'}}</strong><button class="btn" @click="sectionModal=false">Закрыть</button></div><form @submit.prevent="saveSection"><div class="form"><div class="field full"><label>Название</label><input v-model.trim="sectionForm.name" required></div><div class="field"><label>Порядок</label><input v-model.number="sectionForm.sort_order" type="number" min="0"></div></div><div class="modal-foot"><button type="button" class="btn" @click="sectionModal=false">Отмена</button><button class="btn primary" type="submit">Сохранить</button></div></form></div></div>

    <div v-if="userModal" class="modal-backdrop" @click.self="userModal=false"><div class="modal"><div class="modal-head"><strong>{{userEditing?'Редактирование пользователя':'Новый пользователь'}}</strong><button class="btn" @click="userModal=false">Закрыть</button></div><form @submit.prevent="saveUser"><div class="form"><div class="field"><label>Логин</label><input v-model.trim="userForm.username" required></div><div class="field"><label>Имя</label><input v-model.trim="userForm.displayName" required></div><div class="field"><label>Пароль {{userEditing?'(оставьте пустым, чтобы не менять)':''}}</label><input v-model="userForm.password" type="password" :required="!userEditing"></div><div class="field"><label>Роль</label><select v-model="userForm.role"><option value="viewer">Наблюдатель</option><option value="operator">Оператор</option><option value="admin">Администратор</option></select></div><div class="field full"><label>Доступ к камерам</label><select v-model="userForm.scope"><option value="all_cameras">Все камеры</option><option value="section">Целый раздел</option><option value="selected">Отдельные камеры</option><option value="none">Нет доступа</option></select></div><div v-if="userForm.scope==='section'" class="field full"><label>Разделы</label><div class="box-list"><label v-for="s in sections" :key="s.id" class="check-item"><input type="checkbox" :value="Number(s.id)" v-model="userForm.sectionIDs"> {{s.name}}</label></div></div><div v-if="userForm.scope==='selected'" class="field full"><label>Камеры</label><div class="box-list"><label v-for="c in allCameras" :key="c.id" class="check-item"><input type="checkbox" :value="Number(c.db_id)" v-model="userForm.cameraIDs"> {{c.name}} <span class="muted">{{c.section_name||'без раздела'}}</span></label></div></div><div class="field full"><label class="check-item"><input type="checkbox" v-model="userForm.active"> Пользователь активен</label></div></div><div class="modal-foot"><button type="button" class="btn" @click="userModal=false">Отмена</button><button class="btn primary" type="submit">Сохранить</button></div></form></div></div>

    <div v-if="error" class="error">{{error}}</div>
  </template>

<script>
const {createApp}=Vue;
createApp({
data(){return{ready:false,authenticated:false,setupRequired:false,currentUser:null,login:{username:'',password:'',displayName:''},error:'',tab:'live',cameras:[],allCameras:[],sections:[],users:[],dvrs:[],dvrChannels:[],dvrChannelsId:0,dvrChannelsName:'',dvrChannelsBusy:false,selectedSectionId:'',gridSize:'all',defaultStream:'sub',showOnlyFavorites:false,favorites:[],alertsOpen:false,archiveCameraId:'',archiveDate:new Date().toISOString().slice(0,10),archiveSegments:[],archiveSelectedUrl:'',archiveBusy:false,archiveError:'',cameraStreams:{},videoRefs:{},streamPCs:{},liveErrors:{},focusedCameraId:'',scanOpen:false,scanCIDR:'10.120.10.0/24',scanBusy:false,scanResults:[],modal:false,editing:false,editingId:'',form:{ip:'',username:'',password:'',enabled:true,autostart:true,section_id:'',sort_order:0},dvrModal:false,dvrEditing:false,dvrEditingId:0,dvrForm:{name:'',ip:'',username:'admin',password:'',section_id:'',channels:16,enabled:true,autostart:true,sort_order:0},sectionModal:false,sectionEditing:false,sectionForm:{id:null,name:'',sort_order:0},userModal:false,userEditing:false,userEditingId:0,userForm:{username:'',displayName:'',password:'',role:'viewer',scope:'selected',sectionIDs:[],cameraIDs:[],active:true},config:{recording_dir:'',motion_post_seconds:10}}},
methods:{
async api(url,opt){const r=await fetch(url,opt||{});if(!r.ok){let t=await r.text();throw new Error(t||('HTTP '+r.status));}return r.json()},
async checkAuth(){try{const d=await this.api('/api/auth/status');this.setupRequired=!!d.setup_required;this.authenticated=!!d.authenticated;this.currentUser=d.user;if(this.authenticated)await this.reload();}catch(e){this.error=e.message}finally{this.ready=true}},
async signin(){try{this.error='';await this.api('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:this.login.username,password:this.login.password})});this.login.password='';await this.checkAuth()}catch(e){this.error=e.message}},
async bootstrap(){try{this.error='';await this.api('/api/auth/bootstrap',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:this.login.username,password:this.login.password,displayName:this.login.displayName})});this.login.password='';await this.checkAuth()}catch(e){this.error=e.message}},
async signout(){await fetch('/api/auth/logout',{method:'POST'});location.reload()},
async reload(){this.error='';try{this.cameras=await this.api('/api/cameras');this.sections=await this.api('/api/sections');if(this.currentUser&&this.currentUser.admin){this.allCameras=await this.api('/api/cameras?all=1');this.dvrs=await this.api('/api/dvrs');await this.loadUsers();const d=await this.api('/api/config');this.config=d}}catch(e){if(String(e.message).includes('unauthorized')){location.reload()}else{this.error=e.message}}},
async loadUsers(){this.users=await this.api('/api/users')},
roleName(r){return r==='admin'?'Администратор':r==='operator'?'Оператор':'Наблюдатель'},
loadFavorites(){try{const v=JSON.parse(localStorage.getItem('video-core-favorites')||'[]');this.favorites=Array.isArray(v)?v.map(String):[]}catch(e){this.favorites=[]}},
isFavorite(id){return this.favorites.includes(String(id))},
toggleFavorite(id){const key=String(id);if(this.isFavorite(key))this.favorites=this.favorites.filter(v=>v!==key);else this.favorites=[...this.favorites,key];localStorage.setItem('video-core-favorites',JSON.stringify(this.favorites));if(this.showOnlyFavorites)this.syncGridStreams()},
streamFor(){return 'sub'},
setVideoRef(id,el){if(el)this.videoRefs[id]=el;else delete this.videoRefs[id]},
focusCamera(camera){this.focusedCameraId=camera.id;this.syncGridStreams()},
async toggleFullscreen(event){
  const tile=event&&event.currentTarget?event.currentTarget.closest('.camera-tile'):null;
  if(!tile)return;
  try{
    if(document.fullscreenElement){await document.exitFullscreen();}
    else if(tile.requestFullscreen){await tile.requestFullscreen();}
  }catch(e){this.error='Не удалось открыть полноэкранный режим: '+e.message}
},
openCamera(camera){this.selectedSectionId=camera.section_id?String(camera.section_id):'';this.focusedCameraId=camera.id;this.tab='live';this.$nextTick(()=>this.syncGridStreams())},
formatBytes(n){const v=Number(n)||0;if(v<1024)return v+' Б';if(v<1024*1024)return (v/1024).toFixed(0)+' КБ';if(v<1024*1024*1024)return (v/1024/1024).toFixed(1)+' МБ';return (v/1024/1024/1024).toFixed(2)+' ГБ'},
async loadArchive(){if(!this.archiveCameraId)return;try{this.archiveBusy=true;this.archiveError='';this.archiveSelectedUrl='';const d=await this.api('/api/cameras/'+encodeURIComponent(this.archiveCameraId)+'/archive?date='+encodeURIComponent(this.archiveDate));this.archiveSegments=d.items||[];if(d.storage_mounted===false)this.archiveError=d.error||'Архивное хранилище не подключено';}catch(e){this.archiveSegments=[];this.archiveError=e.message}finally{this.archiveBusy=false}},
playArchive(segment){this.archiveSelectedUrl=segment.url},
archiveSegmentStart(segment){const d=new Date(segment.started||0);return Number.isNaN(d.getTime())?0:(d.getHours()*3600+d.getMinutes()*60+d.getSeconds())},
archiveSegmentStyle(segment){const start=this.archiveSegmentStart(segment);const duration=Number(this.config.segment_seconds)||300;const left=Math.max(0,Math.min(99.9,start/86400*100));const width=Math.max(.18,Math.min(100-left,duration/86400*100));return {left:left+'%',width:width+'%'}},
clearFocus(){if(this.focusedCameraId){this.focusedCameraId='';this.syncGridStreams()}},
async connectStream(camera,stream){
  this.closeStream(camera.id);
  if(!camera.running){this.liveErrors[camera.id]='Камера остановлена';return}
  const video=this.videoRefs[camera.id];
  if(!video)return;
  this.liveErrors[camera.id]='Подключение '+(stream==='main'?'MAIN':'SUB')+'…';
  try{
    const pc=new RTCPeerConnection();
    this.streamPCs[camera.id]=pc;
    pc.ontrack=e=>{if(this.videoRefs[camera.id])this.videoRefs[camera.id].srcObject=e.streams[0]};
    pc.onconnectionstatechange=()=>{
      if(['failed','disconnected'].includes(pc.connectionState)&&this.streamPCs[camera.id]===pc){
        this.liveErrors[camera.id]='Поток '+(stream==='main'?'MAIN':'SUB')+' недоступен';
      }else if(pc.connectionState==='connected'&&this.streamPCs[camera.id]===pc){
        delete this.liveErrors[camera.id];
      }
    };
    pc.addTransceiver('video',{direction:'recvonly'});
    pc.addTransceiver('audio',{direction:'recvonly'});
    const offer=await pc.createOffer();
    await pc.setLocalDescription(offer);
    if(pc.iceGatheringState!=='complete'){
      await new Promise(resolve=>{
        const timer=setTimeout(resolve,3000);
        pc.onicegatheringstatechange=()=>{if(pc.iceGatheringState==='complete'){clearTimeout(timer);resolve()}};
      });
    }
    const answer=await fetch('/api/cameras/'+encodeURIComponent(camera.id)+'/webrtc?stream='+encodeURIComponent(stream),{
      method:'POST',headers:{'Content-Type':'application/sdp'},body:pc.localDescription.sdp
    });
    if(!answer.ok)throw new Error((await answer.text())||('HTTP '+answer.status));
    await pc.setRemoteDescription({type:'answer',sdp:await answer.text()});
    if(this.streamPCs[camera.id]!==pc)pc.close();
  }catch(e){
    if(this.streamPCs[camera.id])delete this.streamPCs[camera.id];
    const message=String(e&&e.message||e||'Неизвестная ошибка').replace(/^Error:\s*/,'').trim();
    this.liveErrors[camera.id]='Ошибка подключения '+(stream==='main'?'MAIN':'SUB')+': '+(message||'неизвестная ошибка');
  }
},
closeStream(id){
  const pc=this.streamPCs[id];
  if(pc){pc.ontrack=null;pc.close();delete this.streamPCs[id]}
  const video=this.videoRefs[id];
  if(video)video.srcObject=null;
},
async syncGridStreams(){
  if(this.tab!=='live'){this.closeAllStreams();return}
  const visible=this.visibleCameras.slice();
  const visibleIds=new Set(visible.map(c=>c.id));
  for(const id of Object.keys(this.streamPCs))if(!visibleIds.has(id))this.closeStream(id);
  await this.$nextTick();
  const pending=visible
    .filter(camera=>{
      const pc=this.streamPCs[camera.id];
      return !pc||pc.connectionState==='failed'||pc.connectionState==='closed';
    })
    .map(camera=>this.connectStream(camera,this.streamFor(camera)));
  await Promise.allSettled(pending);
},
closeAllStreams(){for(const id of Object.keys(this.streamPCs))this.closeStream(id)},
setGridSize(n){this.focusedCameraId='';this.gridSize=n;this.syncGridStreams()},
sectionChanged(){this.focusedCameraId='';this.syncGridStreams()},
setDefaultStream(){this.defaultStream='sub';this.syncGridStreams()},
setCameraStream(camera){this.connectStream(camera,'sub')},
scopeName(s){return s==='all_cameras'?'Все камеры':s==='section'?'Раздел':s==='none'?'Нет доступа':'Отдельные камеры'},
emptyCamera(){return{ip:'',username:'',password:'',enabled:true,autostart:true,section_id:'',sort_order:0}},
openDvrChannels(d){this.dvrChannelsId=d.id;this.dvrChannelsName=d.name;this.dvrChannels=[];this.dvrChannelsBusy=true;this.api('/api/dvrs/'+d.id+'/channels').then(v=>this.dvrChannels=v||[]).catch(e=>this.error='Не удалось загрузить каналы: '+e.message).finally(()=>this.dvrChannelsBusy=false)},
async toggleDvrChannel(channel){
  try{
    const enabled=!channel.enabled;
    const result=await this.api('/api/dvrs/'+this.dvrChannelsId+'/channels',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({channel:channel.channel,enabled})});
    channel.enabled=enabled;
    if(result&&result.camera_id){
      const camera=this.cameras.find(c=>c.id===result.camera_id);
      if(camera)camera.enabled=enabled;
      if(!enabled){
        this.closeStream(result.camera_id);
        delete this.liveErrors[result.camera_id];
      }
    }
    await this.reload();
  }catch(e){
    this.error='Не удалось изменить канал CH'+String(channel.channel).padStart(2,'0')+': '+e.message
  }
},
openDvrNew(){this.error='';this.dvrEditing=false;this.dvrEditingId=0;this.dvrForm={name:'',ip:'',username:'admin',password:'',section_id:'',channels:16,enabled:true,autostart:true,sort_order:0};this.dvrModal=true},
async openDvrEdit(d){this.error='';this.dvrEditing=true;this.dvrEditingId=d.id;this.dvrForm={name:d.name||'',ip:d.ip||'',username:d.username||'',password:'',section_id:d.section_id?String(d.section_id):'',channels:d.channels||16,enabled:!!d.enabled,autostart:true,sort_order:d.sort_order||0};this.dvrModal=true},
async saveDvr(){try{this.error='';const body={name:this.dvrForm.name,ip:this.dvrForm.ip,username:this.dvrForm.username,password:this.dvrForm.password,section_id:this.dvrForm.section_id?Number(this.dvrForm.section_id):null,enabled:!!this.dvrForm.enabled,autostart:!!this.dvrForm.autostart,sort_order:Number(this.dvrForm.sort_order)||0};body.channels=Math.max(1,Math.min(32,Number(this.dvrForm.channels)||16));await this.api(this.dvrEditing?('/api/dvrs/'+this.dvrEditingId):'/api/dvrs',{method:this.dvrEditing?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});this.dvrModal=false;await this.reload();this.tab='dvr'}catch(e){this.error='Не удалось сохранить DVR: '+e.message}},
async removeDvr(d){if(!confirm('Удалить регистратор «'+d.name+'» и все его каналы?'))return;try{await this.api('/api/dvrs/'+d.id,{method:'DELETE'});await this.reload()}catch(e){this.error=e.message}},
openNew(){this.error='';this.editing=false;this.form=this.emptyCamera();this.modal=true},
async openEdit(c){this.error='';const d=await this.api('/api/cameras/'+encodeURIComponent(c.id)+'/details');this.editing=true;this.editingId=c.id;this.form={ip:d.ip||'',username:d.username||'',password:'',enabled:c.enabled,autostart:c.autostart,section_id:c.section_id?String(c.section_id):'',sort_order:c.sort_order||0};this.modal=true},
async saveCamera(){
  try{
    this.error='';
    const body={
      ip:this.form.ip,
      username:this.form.username,
      password:this.form.password,
      enabled:!!this.form.enabled,
      autostart:!!this.form.autostart,
      section_id:this.form.section_id?Number(this.form.section_id):null,
      sort_order:Number(this.form.sort_order)||0
    };
    const result=await this.api(this.editing?'/api/cameras/'+encodeURIComponent(this.editingId)+'/update':'/api/cameras',{
      method:this.editing?'PUT':'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(body)
    });
    this.modal=false;
    await this.reload();
    this.tab='cameras';
    if(result&&result.start_error)this.error='Камера добавлена, но не запустилась: '+result.start_error;
  }catch(e){
    this.error='Не удалось сохранить камеру: '+e.message;
  }
},
async remove(c){if(!confirm('Удалить камеру «'+c.name+'»?'))return;try{await this.api('/api/cameras/'+encodeURIComponent(c.id)+'/delete',{method:'DELETE'});await this.reload()}catch(e){this.error=e.message}},
async toggle(c){try{await this.api('/api/cameras/'+encodeURIComponent(c.id)+'/'+(c.running?'stop':'start'),{method:'POST'});await new Promise(r=>setTimeout(r,350));await this.reload()}catch(e){this.error=e.message}},
scanOpenNetwork(){this.scanResults=[];this.scanOpen=true},
async scanNetwork(){try{this.scanBusy=true;this.error='';this.scanResults=await this.api('/api/scan?cidr='+encodeURIComponent(this.scanCIDR));}catch(e){this.error=e.message}finally{this.scanBusy=false}},
openSectionNew(){this.sectionEditing=false;this.sectionForm={id:null,name:'',sort_order:0};this.sectionModal=true},
openSectionEdit(s){this.sectionEditing=true;this.sectionForm={id:s.id,name:s.name,sort_order:s.sort_order||0};this.sectionModal=true},
async saveSection(){try{const body={name:this.sectionForm.name,sort_order:Number(this.sectionForm.sort_order)||0};await this.api(this.sectionEditing?'/api/sections/'+this.sectionForm.id:'/api/sections',{method:this.sectionEditing?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});this.sectionModal=false;await this.reload();this.tab='sections'}catch(e){this.error=e.message}},
async removeSection(s){if(!confirm('Удалить раздел «'+s.name+'»?'))return;try{await this.api('/api/sections/'+s.id,{method:'DELETE'});await this.reload()}catch(e){this.error=e.message}},
openUserNew(){this.userEditing=false;this.userForm={username:'',displayName:'',password:'',role:'viewer',scope:'selected',sectionIDs:[],cameraIDs:[],active:true};this.userModal=true},
async openUserEdit(u){const d=await this.api('/api/users/'+u.id);this.userEditing=true;this.userEditingId=u.id;this.userForm={username:d.username,displayName:d.display_name,password:'',role:d.role,scope:d.scope,sectionIDs:d.section_ids||[],cameraIDs:d.camera_ids||[],active:d.active};this.userModal=true},
async saveUser(){try{const body={username:this.userForm.username,displayName:this.userForm.displayName,password:this.userForm.password,role:this.userForm.role,scope:this.userForm.scope,sectionIDs:this.userForm.sectionIDs,cameraIDs:this.userForm.cameraIDs,active:this.userForm.active};await this.api(this.userEditing?'/api/users/'+this.userEditingId:'/api/users',{method:this.userEditing?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});this.userModal=false;await this.loadUsers();await this.reload()}catch(e){this.error=e.message}},
async removeUser(u){if(!confirm('Удалить пользователя «'+u.display_name+'»?'))return;try{await this.api('/api/users/'+u.id,{method:'DELETE'});await this.loadUsers()}catch(e){this.error=e.message}},
async saveConfig(){try{this.config.motion_post_seconds=Number(this.config.motion_post_seconds)||0;await this.api('/api/config',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({RecordingDir:this.config.recording_dir,MotionPostSeconds:this.config.motion_post_seconds})});alert('Настройки сохранены')}catch(e){this.error=e.message}}
},
computed:{
  ipCameras(){const source=this.currentUser&&this.currentUser.admin?this.allCameras:this.cameras;return source.filter(c=>c.source_type!=='dvr')},
  availableSections(){
    const counts=new Map();
    const names=new Map();
    for(const c of this.cameras){
      if(!c.enabled || !c.section_id)continue;
      const key=String(c.section_id);
      counts.set(key,(counts.get(key)||0)+1);
      if(c.section_name)names.set(key,c.section_name);
    }
    const merged=new Map();
    for(const s of this.sections){
      const key=String(s.id);
      merged.set(key,{id:s.id,name:s.name,count:counts.get(key)||0});
    }
    for(const [key,name] of names){
      if(!merged.has(key))merged.set(key,{id:Number(key),name,count:counts.get(key)||0});
    }
    return Array.from(merged.values())
      .filter(s=>this.currentUser&&this.currentUser.admin ? true : counts.has(String(s.id)))
      .sort((a,b)=>String(a.name).localeCompare(String(b.name),'ru'));
  },
  sectionCameras(){
    const active=this.cameras.filter(c=>c.enabled===true);
    if(!this.selectedSectionId)return active;
    return active.filter(c=>String(c.section_id||'')===String(this.selectedSectionId));
  },
  visibleCameras(){
    const available=this.showOnlyFavorites?this.sectionCameras.filter(c=>this.isFavorite(c.id)):this.sectionCameras;
    if(this.focusedCameraId){
      const focused=available.find(c=>c.id===this.focusedCameraId);
      if(!focused)return available.slice(0,this.gridSize==='all'?available.length:this.gridSize);
      const limit=this.gridSize==='all'?available.length:Math.max(1,this.gridSize);
      const others=available.filter(c=>c.id!==focused.id).slice(0,Math.max(0,limit-1));
      return [focused,...others];
    }
    return this.gridSize==='all'?available:available.slice(0,this.gridSize);
  },
  onlineCount(){return this.sectionCameras.filter(c=>c.running&&c.stream_ok).length},
  recordingCount(){return this.sectionCameras.filter(c=>c.recording).length},
  archiveTimelineSegments(){return this.archiveSegments.slice().sort((a,b)=>new Date(a.started||0)-new Date(b.started||0))},
  archiveSelectedSegment(){return this.archiveSegments.find(s=>s.url===this.archiveSelectedUrl)||null},
  archiveCoverageText(){
    if(!this.archiveSegments.length)return '';
    const sorted=this.archiveTimelineSegments;
    const start=new Date(sorted[0].started||0),end=new Date(sorted[sorted.length-1].started||0);
    if(Number.isNaN(start.getTime())||Number.isNaN(end.getTime()))return '';
    return start.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})+'–'+new Date(end.getTime()+(Number(this.config.segment_seconds)||300)*1000).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
  },
  alerts(){
    return this.sectionCameras.filter(c=>!c.running||!c.stream_ok).map(c=>({
      id:c.id,
      camera:c,
      message:!c.running?'Камера остановлена':(c.stream_error||'Нет видеопотока')
    }));
  },
  monitorGridStyle(){
    const count=this.visibleCameras.length;
    if(this.focusedCameraId){
      const rows=Math.max(1,Math.ceil(Math.max(0,count-1)/2));
      return {'--monitor-cols':3,'--monitor-rows':Math.max(2,rows)};
    }
    if(this.gridSize==='all'){
      return {'--monitor-cols':1,'--monitor-rows':1};
    }
    const layouts={
      1:{cols:1,rows:1},
      4:{cols:2,rows:2},
      6:{cols:3,rows:2},
      9:{cols:3,rows:3},
      16:{cols:4,rows:4},
      32:{cols:8,rows:4},
      64:{cols:8,rows:8},
      128:{cols:16,rows:8}
    };
    const layout=layouts[this.gridSize]||layouts[4];
    return {'--monitor-cols':layout.cols,'--monitor-rows':layout.rows};
  }
},
mounted(){
  this.loadFavorites();
  window.addEventListener('keydown',e=>{if(e.key==='Escape'&&this.focusedCameraId&&!document.fullscreenElement)this.clearFocus()});
  this.checkAuth().then(()=>this.$nextTick(()=>this.syncGridStreams()));
  setInterval(()=>{if(this.authenticated)this.reload()},15000);
  setInterval(()=>{if(this.authenticated&&this.tab==='live')this.syncGridStreams()},15000);
},
watch:{
  tab(){this.$nextTick(()=>this.syncGridStreams())},
  cameras(){if(this.tab==='live')this.$nextTick(()=>this.syncGridStreams())}
}
}).mount('#app');
</script>
